works:
- title: "Borders, Bridges and Urban Integration: Evidence from Denmark and Sweden"
  pdflink: "https://tinyurl.com/39r8etdh"
  note: "Current Version: November 2023"
  abstract: >
    This paper examines the commuter market structure of a cross-border region in Denmark and Sweden. We document that the border has a large negative effect on commuting, depressing flows by 85%. However, we also show that potential cross-border commuters are responsive to improved connections across the border. When a bridge is opened in the year 2000, it leads to dramatically increased commuting flows and shocks to local land and labour markets. We use a quantitative spatial equilibrium model with two populations to quantify the effects of the bridge on welfare and to compute counterfactuals. Our results show that Swedes benefited substantially more than Danes from the bridge and that the commuter market effects, by themselves, do not justify the expenses incurred during the bridge’s construction.